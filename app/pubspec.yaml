name: comeover
description: "ComeOver — invite someone, watch them arrive. Live distance, ETA and countdown on phones, tablets and TV."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  http: ^1.6.0
  latlong2: ^0.10.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
        - asset: assets/fonts/Figtree-Italic.ttf
          style: italic
