name: Relay image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish multi-arch relay image (with bundled web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the web client
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Bundle the web build into server/web-dist
        run: |
          cd app
          flutter pub get
          # Served from the relay origin, so the app correctly uses its own
          # origin as the relay — no COMEOVER_SERVER define needed.
          flutter build web --release
          rm -rf ../server/web-dist/.gitkeep
          cp -r build/web/. ../server/web-dist/
          ls ../server/web-dist | head

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/comeover-relay
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show digest
        run: |
          echo "Published image digest: ${{ steps.build.outputs.digest }}"
          echo "Pin it in deploy/umbrel/comeover/docker-compose.yml after making the package public."
